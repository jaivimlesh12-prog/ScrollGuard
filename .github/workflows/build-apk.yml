name: Build ScrollGuard Downloadable APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Post Error Log to GitHub Issues
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = "No log found";
            try {
              log = fs.readFileSync('build.log', 'utf8');
              log = log.slice(-4000); // Last 4000 chars of build log
            } catch(e) {
              log = e.toString();
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Build Diagnostics: Compilation Errors',
              body: '```\n' + log + '\n```'
            });

      - name: Upload Downloadable APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ScrollGuard-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 30
