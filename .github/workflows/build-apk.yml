name: Build ScrollGuard Downloadable APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p apk_output
          find app/build/outputs -type f -name "*.apk" -exec cp {} apk_output/ScrollGuard-debug.apk \;
          echo "Listing copied APK:"
          ls -lh apk_output/

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrollGuard-debug-apk
          path: apk_output/ScrollGuard-debug.apk
          if-no-files-found: error
          retention-days: 30
