name: Build ScrollGuard Downloadable APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Capture Failure Diagnostic Log
        if: failure()
        run: |
          # 1. Upload to ephemeral paste
          curl -sF "file=@build.log" https://file.io || true

          # 2. Push to diagnostics branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B diagnostics
          git add build.log -f
          git commit -m "Auto-captured build failure log" || true
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git diagnostics || true

      - name: Prepare APK Output
        if: success()
        run: |
          mkdir -p apk_output
          find app/build/outputs -type f -name "*.apk" -exec cp {} apk_output/ScrollGuard-debug.apk \;
          ls -lh apk_output/

      - name: Upload Downloadable APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ScrollGuard-debug-apk
          path: apk_output/ScrollGuard-debug.apk
          if-no-files-found: error
          retention-days: 30
